; ============================================================================
;  网页抓取重建器 — 抓取任务配置文件（完整参考示例）
; ----------------------------------------------------------------------------
;  用法：WebScrapingRebuilder.exe <本文件的路径>
;
;  本文件是【所有配置项的唯一权威说明】。每一项的含义、取值范围、默认值、
;  可选写法与示例都在这里以注释形式给出；README.md 不再重复配置项说明。
;
;  语法（宽容解析）：
;    - 段头：[Section]
;    - 注释：整行以 ; 开头（行内 ; 不视为注释）
;    - 键值：以“第一个 = ”分隔，键=等号前(去空格)，值=等号后整段(去首尾空格)
;    - 值中可以包含任意多个 =、空格和特殊字符，无需引号/转义
;    - 同一段内普通键重复出现时取“最后一行”；[Url] 的两个键是可重复键，全部生效
; ============================================================================


; ----------------------------------------------------------------------------
; [Format] 文件版本校验（必需）
; ----------------------------------------------------------------------------
[Format]
; 用于确认这是本程序可识别的 INI 文件。必须严格等于 WebsiteScrapingVer1，
; 否则程序会报错退出，防止误传入无效/其他格式的文件。
Format = WebsiteScrapingVer1


; ----------------------------------------------------------------------------
; [Task] 抓取任务参数
; ----------------------------------------------------------------------------
[Task]

; 【必需】抓取入口页面。必须是完整的 http/https URL。
; 程序只把它当作抓取起点；其 Host（例如 xxx.com）用于 AllowedHost=this/this* 判定。
Netloc = https://xxx.com/yyy.html

; 【必需】文件保存根目录，不存在会自动创建。支持相对路径（会转为绝对路径）。
SaveTo = D:\Scraping\xxx\yyy

; 文件在 SaveTo 下的分类方式：
;   AbsoluteRaw = 按原始 URL 的绝对路径保存，并额外加一层 host 文件夹，避免不同站点同名路径互相冲突。
;                 示例：D:\Scraping\xxx\yyy\www.cdn1.com\static\video\1.mp4
;   RelativeRaw = 按 URL 的相对路径保存，不加 host 文件夹。
;                 示例：D:\Scraping\xxx\yyy\static\video\1.mp4
;   Mime        = 按响应的 MIME 类型分文件夹（包含 mime 中的斜杠）。
;                 示例：D:\Scraping\xxx\yyy\video\mp4\1.mp4
;   None        = 不分类，所有文件都堆到 SaveTo 根目录。
GroupingMethod = AbsoluteRaw

; 文件重名时的抗重复策略（本地文件名不含 URL 查询参数，故不同参数可能撞名）：
;   Sha256 = 比较两份文件内容的 SHA256：相同则只保留一份（跳过新文件）；不同则重命名保存。
;            重命名规则：原文件名去掉后缀后加 _{index}，如 Video.mp4 -> Video_1.mp4。
;   Always = 不做任何内容校验，遇到同名直接重命名保存新文件。
;   Size   = 只比较文件大小：大小相同直接覆盖；不同则重命名保存。
AntiDuplicate = Sha256

; 请求节流间隔（毫秒）。防止被目标站 429/限速。
;   > 0  ：每个工作线程在【每次请求前】固定等待该毫秒数。总速率约 MultiThread/IntervalMs。
;   = 0  ：不固定等待，改为启用“指数退避”模式（每个工作线程独立计时）：
;          首次等待 1000ms；若某个 URL 下载失败，则把本线程的等待翻倍（上限 60000ms）；
;          任一 URL 下载成功后立即重置回 1000ms。适用于不想指定固定间隔、
;          但希望在遇到连续错误时自动放缓、避免持续冲击目标站的场景。
; 合法范围：>= 0。
IntervalMs = 1000

; 可恢复错误的重试次数。
;   - 视为可恢复：网络错误、超时、429、5xx、408、425，以及 IO/文件瞬时错误等。
;   - 不可恢复、不重试：403、404 等明确表示资源不存在/无权限的状态。
; 合法范围：>= 0。实际会在此次数用尽后放弃并记入 Failed.txt。
RetryError = 10

; 文件体积下限（KB）。小于该值的文件视为无用小文件，跳过不保存。
; 写 0 表示不设下限。此下限对【所有】文件一视同仁（M3U8 播放列表及其分片也不例外）。
; 合法范围：>= 0，且不能大于 MaxDownloadSizeKb（当 MaxDownloadSizeKb > 0 时）。
MinDownloadSizeKb = 0

; 单个文件体积上限（KB）。超过该值的文件跳过，防止意外大文件塞满磁盘。
; 写 0 表示【不限制】（不设上限；用于不想写 999999999 这种大数的情况）。
; 合法范围：>= 0。此上限对【所有】文件一视同仁，M3U8 播放列表及其分片也没有例外。
MaxDownloadSizeKb = 1048576

; 按【扩展名】忽略下载的文件类型，逗号分隔（不含点号，大小写不敏感）。
; 留空或删除表示不按扩展名忽略。M3U8/M3U 扩展名写死在代码中、不受此项影响。
IgnoredFileExt = exe,msi,rpm,apk

; 按【响应 MIME】忽略下载的文件类型，逗号分隔。支持 * 通配（如 text/*、
; application/vnd.openxmlformats-officedocument.*）。M3U8/HLS 的 MIME 写死在代码中、不受此项影响。
IgnoredFileMime = application/x-msdownload,application/vnd.openxmlformats-officedocument.wordprocessingml.document

; 循环抓取时，哪些【扩展名】的文件要当作文本读取、从中继续提取新 URL。逗号分隔。
ExtractFileExt = html,js,css,txt

; 循环抓取时，哪些【MIME】的文件要当作文本读取、提取新 URL。支持通配（如 text/*）。
; 说明：ExtractFileExt 与 ExtractFileMime 若【同时为空】，程序会回退到默认值：
;       ExtractFileExt = html,js,css,txt，ExtractFileMime = text/*。
ExtractFileMime = text/*

; 站点 Host 限制，防止因页面上的外链而“蝴蝶效应”抓到无关网站：
;   this    = 只允许与入口站点完全相同的 Host。
;   this*   = 允许入口站点及其子域名（如 xxx.com 允许 a.xxx.com）。
;   all     = 不限制，允许抓取任何 Host（默认值，不写此项时即 all）。
;   limited = 只允许 LimitedList 中列出的关联站；此时 LimitedList 必须存在且非空。
AllowedHost = limited

; 当 AllowedHost = limited 时必填：允许的关联站列表，逗号分隔。
; 支持前导通配 *.domain（匹配 domain 及其所有子域名）。
; 被 Host 限制拦截的 URL 会全部记录到 SaveTo\IgnoredByPolicies.txt。
LimitedList = xyz.com,*.xxx-cdn.com

; 并发下载的工作线程数。默认 5。
; 内部会夹紧到 [1, 256]：<=0 按 1 处理，>256 按 256 处理。
MultiThread = 5

; 是否忽略“中断续抓列表” SaveTo\InQueue.txt：
;   false（默认）= 若该文件存在，则读取其中的 URL 继续上次未完成的抓取（不会重复抓入口页）。
;   true          = 忽略它，按全新任务从 Netloc 重新开始。
; 无论哪种情况，读取后都会把该文件截断为 0 字节，避免下次误读旧列表。
IgnoreQueueTemp = false

; 按下 Ctrl+C 时对【在途下载】的处理策略：
;   Finish      = 不再领取新任务，先让正在下载的文件下载完成，再退出；这些文件正常入库。
;   KeepPartial = 立即中断，但保留 .part/.state 断点；URL 写回 InQueue.txt，下次自动续传（默认）。
;   Discard     = 立即中断并删除断点，URL 写回 InQueue.txt，下次重新下载。
; 兼容别名：Resume = KeepPartial，Abort = Discard。
CtrlCAction = KeepPartial

; 【可选】最多下载多少个文件后停止循环抓取。写 0 或不写表示不限制。
; 达到上限时，剩余队列会写入 InQueue.txt，便于下次续抓（行为等同 KeepPartial）。
MaxDownloadCount = 0

; 【可选】最大抓取深度：入口页为深度 0，其直接链接为深度 1，依此类推。
; 写 0 或不写表示不限制深度。
MaxDepth = 0


; ----------------------------------------------------------------------------
; [Url]（可选）URL 归一化规则
; ----------------------------------------------------------------------------
; 归一化发生在“去重（_seen）与入队”之前：内部记录的“已见 URL”已经是归一化后的 URL，
; 因此同一资源带不同埋点参数时不会被重复抓取。处理顺序：先剔除全部 IgnoreParamName，
; 再依次应用全部 AddParam（同名参数最终以 AddParam 为准）。最后始终会去掉 URL 的 fragment(#...)。
[Url]

; 要剔除的查询参数名；可重复出现，全部生效；名称比较不区分大小写。
; 示例：把下面这些埋点/图片处理参数移除，同一资源的多种写法会折叠为一次抓取。
IgnoreParamName = utm_source
IgnoreParamName = utm_medium
IgnoreParamName = x-oss-process

; 要强制添加的查询参数（name=value）；可重复出现，全部生效；同名参数会覆盖 URL 中已有的同名参数。
; 值本身可以包含 =，例如 AddParam = token=a=b。
AddParam = testparam=1


; ----------------------------------------------------------------------------
; [HttpHeader] 请求头
; ----------------------------------------------------------------------------
; 抓取时携带的 HTTP 头。遵循键值对模式；键不可重复，若意外重复则取行号最大的那一项。
; 支持特殊标签：值中的 {ParentUrl} 会在发送时替换为【父页面 URL】。
[HttpHeader]

; 普通键值对示例（可写多条）。
Key1 = Value1
Key2 = Value2

; 动态 Referer 示例：下载从 https://xxx.com/123/1.html 中发现的
; https://xxx.com/123/1.css 时，Referer 会自动设为前者。
; 入口页面没有父页面，此项会被省略。
Referer = {ParentUrl}

; 其他常见头示例（按需启用）：
; User-Agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36
; Accept = */*
